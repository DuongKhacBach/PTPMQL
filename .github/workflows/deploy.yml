name: Build and Deploy to MonsterASP.NET

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Publish
        run: dotnet publish --configuration Release --output ./publish

      - name: Deploy to MonsterASP via WebDeploy
        shell: pwsh
        env:
          WEBSITE_NAME: ${{ secrets.WEBSITE_NAME }}
          SERVER_COMPUTER_NAME: ${{ secrets.SERVER_COMPUTER_NAME }}
          SERVER_USERNAME: ${{ secrets.SERVER_USERNAME }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
        run: |
          $msdeploy = "C:\Program Files\IIS\Microsoft Web Deploy V3\msdeploy.exe"
          if (-not (Test-Path $msdeploy)) {
            $msdeploy = "C:\Program Files (x86)\IIS\Microsoft Web Deploy V3\msdeploy.exe"
          }

          $siteName = $env:WEBSITE_NAME.Trim()
          $server = $env:SERVER_COMPUTER_NAME.Trim().TrimEnd('/')
          $user = $env:SERVER_USERNAME.Trim()
          $pass = $env:SERVER_PASSWORD.Trim()

          if (-not $siteName -or -not $server -or -not $user -or -not $pass) {
            $msg = "Error: Mot trong 4 secret bi trong (WEBSITE_NAME, SERVER_COMPUTER_NAME, SERVER_USERNAME, SERVER_PASSWORD)."
            Write-Error $msg
            "### $msg" >> $env:GITHUB_STEP_SUMMARY
            exit 1
          }

          # Normalize WebDeploy destination URL
          if ($server -notmatch "^https?://") { $server = "https://$server" }
          if ($server -notmatch "/msdeploy\.axd") { $server = "$server/msdeploy.axd" }
          if ($server -notmatch "\?site=") { $server = "$server?site=$siteName" }

          Write-Host "Target Server: $server"
          Write-Host "Site Name: $siteName"
          Write-Host "User: $user"

          $dest = "contentPath='$siteName',computerName='$server',userName='$user',password='$pass',authType='Basic'"
          $source = "contentPath='$PWD\publish'"

          $output = & $msdeploy -verb:sync -source:$source -dest:$dest -allowUntrusted 2>&1
          $exitCode = $LASTEXITCODE

          $logText = $output | Out-String
          Write-Host $logText

          "### WebDeploy Result (Exit Code: $exitCode)`n```text`n$logText`n```" >> $env:GITHUB_STEP_SUMMARY

          if ($exitCode -ne 0) {
            exit $exitCode
          }
