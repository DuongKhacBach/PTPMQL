name: Build and Deploy to MonsterASP.NET

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Publish
        run: dotnet publish --configuration Release --output ./publish

      - name: Deploy to MonsterASP via WebDeploy
        shell: pwsh
        run: |
          $msdeploy = "C:\Program Files\IIS\Microsoft Web Deploy V3\msdeploy.exe"
          if (-not (Test-Path $msdeploy)) {
            $msdeploy = "C:\Program Files (x86)\IIS\Microsoft Web Deploy V3\msdeploy.exe"
          }
          if (-not (Test-Path $msdeploy)) {
            throw "msdeploy.exe not found on runner."
          }

          $siteName = "${{ secrets.WEBSITE_NAME }}".Trim()
          $server = "${{ secrets.SERVER_COMPUTER_NAME }}".Trim().TrimEnd('/')
          $user = "${{ secrets.SERVER_USERNAME }}".Trim()
          $pass = "${{ secrets.SERVER_PASSWORD }}".Trim()

          if (-not $siteName -or -not $server -or -not $user -or -not $pass) {
            throw "Missing one or more required secrets (WEBSITE_NAME, SERVER_COMPUTER_NAME, SERVER_USERNAME, SERVER_PASSWORD)."
          }

          # Normalize WebDeploy destination URL
          if ($server -notmatch "^https?://") { $server = "https://$server" }
          if ($server -notmatch "/msdeploy\.axd") { $server = "$server/msdeploy.axd" }
          if ($server -notmatch "\?site=") { $server = "$server?site=$siteName" }

          Write-Host "Deploying to: $server (Site: $siteName, User: $user)"

          $destArg = "contentPath=$siteName,computerName=$server,userName=$user,password=$pass,authType=Basic"
          $sourceArg = "contentPath=$PWD\publish"

          & $msdeploy -verb:sync -source:$sourceArg -dest:$destArg -allowUntrusted
